<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperCarlos32 - Búsqueda del tesoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">SUPER CARLOS 32</p>
        <h1>La búsqueda del tesoro</h1>
        <p class="subtitle">Explora las islas y utiliza tu martillo para abrirte camino.</p>
      </div>
      <div class="controls-card" aria-label="Controles">
        <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> Moverse</span>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Moverse</span>
        <span><kbd>Espacio</kbd> / <kbd>X</kbd> Atacar</span>
      </div>
    </header>

    <section class="game-frame" aria-label="Escenario del juego">
      <canvas id="game" width="1774" height="887" aria-label="Mapa jugable"></canvas>
      <div id="loading" class="loading">Cargando la isla...</div>
    </section>

    <footer class="game-footer">
      <span id="status" aria-live="polite">¡Explora la isla!</span>
      <span class="hint">Muévete por la hierba y el puente. Pulsa Espacio o X para atacar.</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
